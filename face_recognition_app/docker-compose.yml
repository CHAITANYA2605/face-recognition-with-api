version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__AUTHENTICATION__ENABLED: "true"
      QDRANT__SERVICE__AUTHENTICATION__USERNAME: "user123"
      QDRANT__SERVICE__AUTHENTICATION__PASSWORD: "abcd"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: